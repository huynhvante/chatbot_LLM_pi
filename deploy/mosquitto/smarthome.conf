# /etc/mosquitto/conf.d/smarthome.conf
# Broker MQTT chính của ngôi nhà, chạy trên Raspberry Pi.
# - Script trên Pi (gateway, face-door, chatbot) nối 127.0.0.1:1883
# - App Android nối thẳng <IP Pi>:1883 khi cùng mạng (Wi-Fi nhà hoặc hotspot điện thoại) -> KHÔNG cần Internet
# - Khi có Internet, cầu nối (hivemq-bridge.conf) đồng bộ với HiveMQ Cloud để app điều khiển từ xa

per_listener_settings false
listener 1883 0.0.0.0

# Bắt buộc đăng nhập + phân quyền theo tài khoản
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Hạn chế dồn tin khi một client (hoặc cầu nối) mất kết nối lâu, tránh "lũ" tin cũ khi nối lại
max_queued_messages 200
# Ảnh đăng ký khuôn mặt gửi qua MQTT có thể lớn: cho phép tối đa 8 MB/tin
message_size_limit 8388608
