# Giới hạn tài nguyên cho Ollama trên Raspberry Pi 5 (4 nhân: 0,1,2,3)
# Cài:  sudo mkdir -p /etc/systemd/system/ollama.service.d
#       sudo cp ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#       sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Ý tưởng: Ollama CHỈ được chạy trên nhân 2-3 và tối đa 2 nhân (200%),
# độ ưu tiên thấp (Nice=10) -> nhân 0-1 luôn trống cho face-door / gateway,
# và khi tranh CPU thì face-door (cửa ra vào, cần realtime) luôn thắng.
[Service]
CPUAffinity=2 3
CPUQuota=180%
Nice=10
IOSchedulingClass=idle
# Giới hạn RAM: qwen2.5:1.5b (Q4) ~1.1 GB; chặn cứng để không đẩy hệ thống vào swap
MemoryHigh=1800M
MemoryMax=2200M

# Chỉ 1 model, 1 request song song, hàng đợi nhỏ
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_MAX_QUEUE=4"
Environment="OLLAMA_KEEP_ALIVE=30m"
# Chỉ nghe trong máy (chatbot_service gọi 127.0.0.1), không mở ra mạng LAN
Environment="OLLAMA_HOST=127.0.0.1:11434"
